<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Liftlog Workout Journal</title>
<style>
body{font:17px/1.6 system-ui,sans-serif;background:#f6f7f4;color:#18251c;margin:0}main,nav{max-width:740px;margin:auto;padding:24px}nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}a{color:#205b37}h1,h2{line-height:1.2}section{background:white;padding:24px;margin:24px 0;border:1px solid #dce2dc;border-radius:12px}input{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #68776c;border-radius:6px}button{font:inherit;background:#205b37;color:white;border:0;padding:12px 20px;border-radius:6px;cursor:pointer}label{display:block;font-weight:600}.helptext{display:block;font-size:14px}.errorlist{color:#9c2222}li{margin-bottom:10px}nav form{margin-left:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 4px;border-bottom:1px solid #dce2dc}
</style></head><body><nav><strong>Liftlog</strong><a href="{% url 'journal-home' %}">Workouts</a>{% if user.is_authenticated %}<form method="post" action="{% url 'web-logout' %}">{% csrf_token %}<button>Sign out</button></form>{% else %}<a href="{% url 'web-login' %}">Sign in</a><a href="{% url 'web-register' %}">Create account</a>{% endif %}</nav><main>{% block content %}{% endblock %}</main></body></html>
